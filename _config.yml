# The Site Configuration

lang: en
timezone: America/Sao_Paulo

title: Lucas Saraiva # browser tab, search engines, feeds
header_name: NAME # the big name in the red header bar (falls back to `title`)
tagline: Doctorate Student @ Unicamp # shown next to the title on wide screens
description: >- # used by SEO meta tags
  This is my personal blog, rarely updated. Feature CV information and other small things relevant to my interests.

url: "https://sarvtex.github.io"
baseurl: ""

author:
  name: Lucas Saraiva Teixeira # default author of posts
  email: lucas.sarvtex@gmail.com

github:
  username: SarvTex

# ------------------------------------------------------------------
# Background image (the right-hand column on wide screens)
#
# Images are taken from `background.folder`. Any jpg/jpeg/png/webp/avif/svg
# placed there becomes part of the collection.
#
#   mode: fixed   – always show `background.image`
#   mode: random  – pick one random image from the collection per page load
#   mode: rotate  – cross-fade through the collection every `interval` seconds
#
# A post/page can override this in its front matter:
#   bg_image: /assets/img/bg/some-image.jpg   # always this image
#   bg_image: none                            # no background column at all
# ------------------------------------------------------------------
background:
  mode: rotate # [fixed | random | rotate]
  folder: /assets/img/bg/
  image: /assets/img/bg/placeholder-1.svg # used by `fixed`
  interval: 12 # seconds, used by `rotate`

# Sidebar
sidebar:
  pinned_max: 3 # posts with `pin: true` in front matter (newest first)
  tag_recent: 3 # posts listed under each expanded tag

# Default color scheme when the visitor hasn't picked one: [system | light | dark]
theme_mode: system

# ------------------------------------------------------------------

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax # outputs \(..\) / \[..\], rendered client-side by KaTeX
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

permalink: /posts/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: true
  - scope:
      path: ""
    values:
      layout: page

sass:
  style: compressed
  silence_deprecations: [import] # @import is simpler to read than @use for a small site

exclude:
  - "*.gem"
  - "*.gemspec"
  - tools
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
